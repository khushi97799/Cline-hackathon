<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Results - Scheme Sniper</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<main class="container section">
  <div class="narrow" style="padding-bottom:0"><div id="stepper"></div></div>
  <div class="row" style="justify-content:space-between">
    <div><h1 data-i18n="results_title">Schemes you may qualify for</h1><p class="muted" data-i18n="results_sub"></p></div>
    <span id="voice-slot"></span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="list" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))"></div>
  <div class="card hidden" id="none"><p class="center muted" data-i18n="none_yet"></p></div>
  <div class="row no-print" style="margin-top:2rem">
    <a class="btn btn-ghost" href="/questions.html" data-i18n="edit_answers">Edit my answers</a>
    <button class="btn-ghost" id="print" data-i18n="print_packet">Print</button>
    <button class="btn-danger" id="del" data-i18n="delete_my_data">Delete my data</button>
  </div>
</main>
<script src="/js/app.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/deadline-ui.js"></script>
<script src="/js/header.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/pages/results.js"></script>
</body>
</html>
