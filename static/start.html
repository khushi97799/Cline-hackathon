<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consent - Scheme Sniper</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<main class="narrow stack">
  <div id="stepper"></div>
  <div class="card stack">
    <div class="row" style="justify-content:space-between"><h2 data-i18n="consent_title">Before we start</h2><span id="speak-slot"></span></div>
    <p class="muted" id="who"></p>

    <div class="choice-row">
      <div><b data-i18n="consent_find_schemes"></b> <span class="badge b-info" data-i18n="consent_required">Required</span></div>
      <div class="tick-cross" data-key="find"><button type="button" data-v="1" aria-label="Yes">✔</button><button type="button" data-v="0" aria-label="No">✘</button></div>
    </div>
    <div class="choice-row">
      <div><span data-i18n="consent_save_profile"></span> <span class="badge b-gray" data-i18n="consent_optional">Optional</span></div>
      <div class="tick-cross" data-key="save"><button type="button" data-v="1">✔</button><button type="button" data-v="0">✘</button></div>
    </div>
    <div class="choice-row" style="border:0">
      <div><span data-i18n="consent_notifications"></span> <span class="badge b-gray" data-i18n="consent_optional">Optional</span></div>
      <div class="tick-cross" data-key="notify"><button type="button" data-v="1">✔</button><button type="button" data-v="0">✘</button></div>
    </div>
    <p class="muted" style="font-size:.88rem" data-i18n="consent_privacy_note"></p>
    <button id="go" class="btn-lg btn-block" disabled data-i18n="consent_continue">Continue</button>
  </div>
</main>
<script src="/js/app.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/header.js"></script>
<script src="/js/chrome.js"></script>
<script src="/js/pages/start.js"></script>
</body>
</html>
